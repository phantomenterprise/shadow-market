<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Street Hustler - Trading Game</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://unpkg.com/tailwindcss@3/dist/tailwind.min.css" rel="stylesheet" />
    <style>
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      .animate-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell',
          sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;

      const Calendar = () => (
        <svg className="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      );

      const DollarSign = () => (
        <svg className="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <line x1="12" y1="1" x2="12" y2="23"></line>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
      );

      const AlertTriangle = () => (
        <svg className="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      );

      const ShoppingCart = () => (
        <svg className="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
      );

      const MapPin = () => (
        <svg className="h-4 w-4 sm:h-5 sm:w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
      );

      const TrendingUp = ({ className }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
          <polyline points="17 6 23 6 23 12"></polyline>
        </svg>
      );

      const TrendingDown = ({ className }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline>
          <polyline points="17 18 23 18 23 12"></polyline>
        </svg>
      );

      const Backpack = () => (
        <svg className="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
          <path d="M12 11v10"></path>
        </svg>
      );

      const Skull = () => (
        <svg className="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="9" cy="12" r="1"></circle>
          <circle cx="15" cy="12" r="1"></circle>
          <path d="M8 16s1.5 2 4 2 4-2 4-2"></path>
          <path d="M12 2C6.5 2 2 6.5 2 12s2 8 5 10v2h10v-2c3-2 5-5 5-10s-4.5-10-10-10z"></path>
        </svg>
      );

      const Share = () => (
        <svg className="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
      );

      const Download = () => (
        <svg className="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      );

      const Bank = () => (
        <svg className="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      );

      const ERAS = {
        eighties: {
          name: '1980s Miami',
          locations: ['Downtown', 'Beach', 'Docks', 'Suburbs', 'Airport', 'Mall'],
          products: [
            { name: 'Powder', icon: '❄️', basePrice: 5000 },
            { name: 'Grass', icon: '🌿', basePrice: 500 },
            { name: 'Pills', icon: '💊', basePrice: 100 },
            { name: 'Acid', icon: '🔮', basePrice: 1500 },
            { name: 'Heroin', icon: '💉', basePrice: 8000 },
            { name: 'Speed', icon: '⚡', basePrice: 800 },
          ],
        },
        twenties: {
          name: '2020s Tech City',
          locations: ['Downtown', 'Campus', 'Marina', 'Heights', 'Station', 'Plaza'],
          products: [
            { name: 'Crystal', icon: '💎', basePrice: 3000 },
            { name: 'Vapes', icon: '💨', basePrice: 400 },
            { name: 'Benzos', icon: '💊', basePrice: 200 },
            { name: 'Molly', icon: '🎭', basePrice: 1200 },
            { name: 'Fentanyl', icon: '⚠️', basePrice: 10000 },
            { name: 'Adderall', icon: '⚡', basePrice: 600 },
          ],
        },
      };

      const EVENTS = [
        { text: 'Cops nearby! Prices drop as dealers flee.', effect: 'priceDown', chance: 0.15 },
        { text: 'Major bust! Supply shortage drives prices up.', effect: 'priceUp', chance: 0.15 },
        { text: 'New supplier in town. Cheap goods available!', effect: 'bigPriceDown', chance: 0.1 },
        { text: 'Celebrity spotted buying. Demand spikes!', effect: 'bigPriceUp', chance: 0.1 },
        { text: 'Rival dealer wants to trade info for cash.', effect: 'tip', chance: 0.08 },
        { text: 'Found a stash someone dropped! Free product.', effect: 'freeProduct', chance: 0.05 },
        { text: 'Undercover cop tries to buy. You barely escape!', effect: 'loseCash', chance: 0.12 },
        { text: 'Customer shorted you. Lost some cash.', effect: 'loseSmallCash', chance: 0.1 },
      ];

      const UPGRADES = [
        { name: 'Small Bag', capacity: 150, cost: 1000, icon: '🎒' },
        { name: 'Duffel Bag', capacity: 200, cost: 2500, icon: '💼' },
        { name: 'Rolling Case', capacity: 300, cost: 5000, icon: '🧳' },
        { name: 'Cargo Van', capacity: 500, cost: 10000, icon: '🚐' },
      ];

      function StreetHustler() {
        const [era, setEra] = useState(null);
        const [maxDays, setMaxDays] = useState(30);
        const [day, setDay] = useState(1);
        const [cash, setCash] = useState(2000);
        const [debt, setDebt] = useState(5000);
        const [location, setLocation] = useState(0);
        const [inventory, setInventory] = useState({});
        const [prices, setPrices] = useState({});
        const [space, setSpace] = useState(100);
        const [eventMessage, setEventMessage] = useState('');
        const [gameOver, setGameOver] = useState(false);
        const [won, setWon] = useState(false);
        const [showLoanShark, setShowLoanShark] = useState(false);
        const [showUpgrades, setShowUpgrades] = useState(false);
        const [showShareMenu, setShowShareMenu] = useState(false);
        const [showBank, setShowBank] = useState(false);
        const [bankBalance, setBankBalance] = useState(0);

        const currentEra = era ? ERAS[era] : null;
        const INTEREST_RATE = 0.1;

        const totalItems = useMemo(() => Object.values(inventory).reduce((a, b) => a + b, 0), [inventory]);
        const netWorth = useMemo(() => {
          const inventoryValue = Object.keys(inventory).reduce((total, product) => {
            return total + (inventory[product] || 0) * (prices[product] || 0);
          }, 0);
          return cash + bankBalance - debt + inventoryValue;
        }, [cash, bankBalance, debt, inventory, prices]);

        useEffect(() => {
          if (currentEra) {
            generatePrices();
          }
        }, [location, currentEra]);

        useEffect(() => {
          if (day > maxDays) {
            endGame();
          }
        }, [day, maxDays]);

        const generatePrices = () => {
          if (!currentEra) return;
          const newPrices = {};
          currentEra.products.forEach((product) => {
            const variance = 0.3 + Math.random() * 1.4;
            newPrices[product.name] = Math.floor(product.basePrice * variance);
          });
          setPrices(newPrices);
          triggerRandomEvent();
        };

        const triggerRandomEvent = () => {
          if (Math.random() > 0.3) return;

          const event = EVENTS.find((entry) => Math.random() < entry.chance);
          if (!event) return;

          setEventMessage(event.text);
          setTimeout(() => setEventMessage(''), 5000);

          switch (event.effect) {
            case 'priceUp':
              setPrices((prev) => {
                const newPrices = { ...prev };
                const product = Object.keys(prev)[Math.floor(Math.random() * Object.keys(prev).length)];
                newPrices[product] = Math.floor(prev[product] * 1.5);
                return newPrices;
              });
              break;
            case 'priceDown':
              setPrices((prev) => {
                const newPrices = { ...prev };
                const product = Object.keys(prev)[Math.floor(Math.random() * Object.keys(prev).length)];
                newPrices[product] = Math.floor(prev[product] * 0.5);
                return newPrices;
              });
              break;
            case 'bigPriceUp':
              setPrices((prev) => {
                const newPrices = { ...prev };
                const product = Object.keys(prev)[Math.floor(Math.random() * Object.keys(prev).length)];
                newPrices[product] = Math.floor(prev[product] * 2.5);
                return newPrices;
              });
              break;
            case 'bigPriceDown':
              setPrices((prev) => {
                const newPrices = { ...prev };
                const product = Object.keys(prev)[Math.floor(Math.random() * Object.keys(prev).length)];
                newPrices[product] = Math.floor(prev[product] * 0.3);
                return newPrices;
              });
              break;
            case 'freeProduct': {
              const freeProduct = currentEra.products[Math.floor(Math.random() * currentEra.products.length)].name;
              const amount = Math.floor(Math.random() * 5) + 1;
              setInventory((prev) => ({ ...prev, [freeProduct]: (prev[freeProduct] || 0) + amount }));
              break;
            }
            case 'loseCash':
              setCash((prev) => Math.max(0, prev - Math.floor(prev * 0.2)));
              break;
            case 'loseSmallCash':
              setCash((prev) => Math.max(0, prev - Math.floor(Math.random() * 500)));
              break;
            default:
              break;
          }
        };

        const buy = (product, amount) => {
          const cost = prices[product] * amount;

          if (cost > cash) {
            alert('Not enough cash!');
            return;
          }
          if (totalItems + amount > space) {
            alert('Not enough space!');
            return;
          }

          setCash((prev) => prev - cost);
          setInventory((prev) => ({ ...prev, [product]: (prev[product] || 0) + amount }));
        };

        const sell = (product, amount) => {
          if (!inventory[product] || inventory[product] < amount) {
            alert("You don't have that much!");
            return;
          }

          const revenue = prices[product] * amount;
          setCash((prev) => prev + revenue);
          setInventory((prev) => ({ ...prev, [product]: prev[product] - amount }));
        };

        const travel = (newLocation) => {
          setLocation(newLocation);
          setDay((prev) => prev + 1);

          const interestPayment = Math.floor(debt * INTEREST_RATE);
          if (cash >= interestPayment && debt > 0) {
            setCash((prev) => prev - interestPayment);
            setEventMessage(`Loan shark collected $${interestPayment} interest`);
            setTimeout(() => setEventMessage(''), 3000);
          } else if (debt > 0 && cash < interestPayment) {
            setDebt((prev) => prev + interestPayment);
            setEventMessage(`Could not pay interest! Debt increased by $${interestPayment}`);
            setTimeout(() => setEventMessage(''), 3000);
          }
        };

        const payDebt = () => {
          const payment = Math.min(cash, debt);
          setCash((prev) => prev - payment);
          setDebt((prev) => prev - payment);
          if (debt - payment === 0) {
            setEventMessage("Debt paid off! You're free!");
            setTimeout(() => setEventMessage(''), 3000);
          }
        };

        const borrowMoney = (amount) => {
          setCash((prev) => prev + amount);
          setDebt((prev) => prev + amount);
          setShowLoanShark(false);
          setEventMessage(
            `Borrowed $${amount} from the loan shark. Pay it back with ${INTEREST_RATE * 100}% interest!`
          );
          setTimeout(() => setEventMessage(''), 4000);
        };

        const buyUpgrade = (upgrade) => {
          if (cash < upgrade.cost) {
            alert('Not enough cash!');
            return;
          }
          if (space >= upgrade.capacity) {
            alert('You already have this capacity or better!');
            return;
          }

          setCash((prev) => prev - upgrade.cost);
          setSpace(upgrade.capacity);
          setShowUpgrades(false);
          setEventMessage(`Purchased ${upgrade.name}! Capacity increased to ${upgrade.capacity}`);
          setTimeout(() => setEventMessage(''), 3000);
        };

        const depositToBank = (amount) => {
          if (amount > cash) {
            alert("You don't have that much cash!");
            return;
          }
          setCash((prev) => prev - amount);
          setBankBalance((prev) => prev + amount);
          setEventMessage(`Deposited $${amount.toLocaleString()} to bank`);
          setTimeout(() => setEventMessage(''), 3000);
        };

        const withdrawFromBank = (amount) => {
          if (amount > bankBalance) {
            alert('Insufficient bank balance!');
            return;
          }
          setBankBalance((prev) => prev - amount);
          setCash((prev) => prev + amount);
          setEventMessage(`Withdrew $${amount.toLocaleString()} from bank`);
          setTimeout(() => setEventMessage(''), 3000);
        };

        const endGame = () => {
          setGameOver(true);
          setWon(netWorth > 20000);
        };

        const captureAndShare = (platform) => {
          const cardElement = document.getElementById('result-card');
          if (!cardElement) return;

          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const scale = 2;

          canvas.width = cardElement.offsetWidth * scale;
          canvas.height = cardElement.offsetHeight * scale;
          ctx.scale(scale, scale);

          const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
          gradient.addColorStop(0, '#581c87');
          gradient.addColorStop(0.5, '#000000');
          gradient.addColorStop(1, '#4338ca');
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
          ctx.fillRect(20, 20, cardElement.offsetWidth - 40, cardElement.offsetHeight - 40);

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 36px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(won ? '🎉 Victory!' : '💀 Game Over', cardElement.offsetWidth / 2, 80);

          ctx.font = '24px Arial';
          ctx.fillStyle = '#d1d5db';
          let yPos = 140;
          ctx.fillText(`Final Cash: $${cash.toLocaleString()}`, cardElement.offsetWidth / 2, yPos);
          yPos += 40;
          ctx.fillText(`Bank: $${bankBalance.toLocaleString()}`, cardElement.offsetWidth / 2, yPos);
          yPos += 40;
          ctx.fillText(`Remaining Debt: $${debt.toLocaleString()}`, cardElement.offsetWidth / 2, yPos);
          yPos += 40;
          ctx.fillStyle = netWorth > 0 ? '#4ade80' : '#f87171';
          ctx.fillText(`Net Worth: $${netWorth.toLocaleString()}`, cardElement.offsetWidth / 2, yPos);
          yPos += 40;
          ctx.fillStyle = '#9ca3af';
          ctx.font = '18px Arial';
          ctx.fillText(`Days Played: ${day - 1}/${maxDays}`, cardElement.offsetWidth / 2, yPos);
          yPos += 50;
          ctx.fillStyle = '#d1d5db';
          ctx.fillText(won ? 'Successfully paid off debt!' : 'Time ran out', cardElement.offsetWidth / 2, yPos);
          yPos += 60;
          ctx.font = 'bold 20px Arial';
          ctx.fillStyle = '#a78bfa';
          ctx.fillText('💰 Street Hustler 💰', cardElement.offsetWidth / 2, yPos);

          canvas.toBlob((blob) => {
            if (!blob) return;
            const shareText = won
              ? `I made $${netWorth.toLocaleString()} in Street Hustler! 💰`
              : `I played Street Hustler and ended with $${netWorth.toLocaleString()} 💀`;

            if (platform === 'download') {
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = 'street-hustler-results.png';
              a.click();
              URL.revokeObjectURL(url);
            } else if (platform === 'twitter') {
              const tweetUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(
                `${shareText} #StreetHustler`
              )}`;
              window.open(tweetUrl, '_blank');
            } else if (platform === 'facebook') {
              const fbUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(
                window.location.href
              )}&quote=${encodeURIComponent(shareText)}`;
              window.open(fbUrl, '_blank');
            } else if (platform === 'native' && navigator.share) {
              const file = new File([blob], 'street-hustler.png', { type: 'image/png' });
              navigator
                .share({
                  title: 'Street Hustler Results',
                  text: shareText,
                  files: [file],
                })
                .catch(() => {});
            }
          });

          setShowShareMenu(false);
        };

        const startGame = (selectedEra, selectedDays) => {
          setEra(selectedEra);
          setMaxDays(selectedDays);
          setDay(1);
          setCash(2000);
          setDebt(5000);
          setBankBalance(0);
          setLocation(0);
          setInventory({});
          setSpace(100);
          setGameOver(false);
          setWon(false);
          setEventMessage('');
          setShowShareMenu(false);
        };

        if (!era) {
          return (
            <div className="min-h-screen bg-gradient-to-br from-purple-900 via-black to-indigo-900 text-white p-4">
              <div className="mx-auto flex min-h-screen max-w-2xl flex-col items-center justify-center text-center">
                <h1 className="mb-3 text-5xl font-bold">💰 Street Hustler 💰</h1>
                <p className="mb-8 text-sm text-gray-300">
                  Navigate the underground economy. Buy low, sell high, avoid the heat.
                  <br />
                  <span className="text-yellow-400">Pay off your $5,000 debt before time runs out!</span>
                </p>

                <div className="w-full space-y-4 rounded-lg bg-black/50 p-6">
                  <h3 className="text-lg font-bold">Choose Era</h3>
                  <div className="grid gap-3 sm:grid-cols-2">
                    <button
                      onClick={() => startGame('eighties', maxDays)}
                      className="w-full rounded-lg bg-gradient-to-r from-pink-600 to-purple-600 px-6 py-3 text-lg font-bold text-white transition hover:from-pink-700 hover:to-purple-700"
                    >
                      📼 1980s Miami
                    </button>
                    <button
                      onClick={() => startGame('twenties', maxDays)}
                      className="w-full rounded-lg bg-gradient-to-r from-blue-600 to-cyan-600 px-6 py-3 text-lg font-bold text-white transition hover:from-blue-700 hover:to-cyan-700"
                    >
                      🌃 2020s Tech City
                    </button>
                  </div>

                  <div className="mt-4 rounded-lg bg-black/40 p-4">
                    <h3 className="mb-3 text-lg font-bold">Game Length</h3>
                    <div className="flex justify-center gap-4">
                      {[30, 60].map((days) => (
                        <label key={days} className="flex cursor-pointer items-center gap-2">
                          <input
                            type="radio"
                            name="days"
                            value={days}
                            checked={maxDays === days}
                            onChange={() => setMaxDays(days)}
                            className="h-4 w-4"
                          />
                          <span>{days} Days</span>
                        </label>
                      ))}
                    </div>
                  </div>
                </div>
              </div>

              {showShareMenu && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
                  <div className="w-full max-w-md rounded-lg bg-gradient-to-br from-purple-900 to-black p-6">
                    <h2 className="mb-4 flex items-center gap-2 text-2xl font-bold">
                      <Share />
                      Share Your Results
                    </h2>
                    <p className="mb-4 text-sm text-gray-300">Show off your hustle! Share your results or download the image.</p>
                    <div className="mb-4 space-y-2">
                      <button
                        onClick={() => captureAndShare('download')}
                        className="flex w-full items-center justify-center gap-2 rounded bg-blue-600 px-4 py-3 font-bold text-white transition hover:bg-blue-700"
                      >
                        <Download />
                        Download Image
                      </button>
                      {navigator.share && (
                        <button
                          onClick={() => captureAndShare('native')}
                          className="flex w-full items-center justify-center gap-2 rounded bg-green-600 px-4 py-3 font-bold text-white transition hover:bg-green-700"
                        >
                          <Share />
                          Share (Native)
                        </button>
                      )}
                      <button
                        onClick={() => captureAndShare('twitter')}
                        className="w-full rounded bg-sky-500 px-4 py-3 font-bold text-white transition hover:bg-sky-600"
                      >
                        🐦 Share on X/Twitter
                      </button>
                      <button
                        onClick={() => captureAndShare('facebook')}
                        className="w-full rounded bg-blue-700 px-4 py-3 font-bold text-white transition hover:bg-blue-800"
                      >
                        📘 Share on Facebook
                      </button>
                    </div>
                    <button
                      onClick={() => setShowShareMenu(false)}
                      className="w-full rounded bg-gray-700 px-4 py-2 font-bold text-white transition hover:bg-gray-600"
                    >
                      Close
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        if (gameOver) {
          return (
            <div className="flex min-h-screen items-center justify-center bg-gradient-to-br from-purple-900 via-black to-indigo-900 p-4 text-white">
              <div id="result-card" className="w-full max-w-md space-y-6 rounded-lg bg-black/50 p-8 text-center">
                <h1 className="text-4xl font-bold">{won ? '🎉 Victory!' : '💀 Game Over'}</h1>
                <div className="space-y-2 text-lg">
                  <p>Final Cash: ${cash.toLocaleString()}</p>
                  <p>Bank Balance: ${bankBalance.toLocaleString()}</p>
                  <p>Remaining Debt: ${debt.toLocaleString()}</p>
                  <p className={netWorth > 0 ? 'text-green-400' : 'text-red-400'}>
                    Net Worth: ${netWorth.toLocaleString()}
                  </p>
                  <p className="text-sm text-gray-400">Days Played: {day - 1}/{maxDays}</p>
                </div>
                <p className="text-gray-300">
                  {won ? 'You successfully paid off your debt and made a fortune!' : 'Time ran out. Better luck next time.'}
                </p>
                <div className="space-y-2">
                  <button
                    onClick={() => setShowShareMenu(true)}
                    className="flex w-full items-center justify-center gap-2 rounded-lg bg-gradient-to-r from-purple-600 to-pink-600 px-6 py-3 font-bold text-white transition hover:from-purple-700 hover:to-pink-700"
                  >
                    <Share />
                    Share Results
                  </button>
                  <button
                    onClick={() => setEra(null)}
                    className="w-full rounded-lg bg-gradient-to-r from-green-600 to-emerald-600 px-6 py-3 font-bold text-white transition hover:from-green-700 hover:to-emerald-700"
                  >
                    Play Again
                  </button>
                </div>
              </div>

              {showShareMenu && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
                  <div className="w-full max-w-md rounded-lg bg-gradient-to-br from-purple-900 to-black p-6">
                    <h2 className="mb-4 flex items-center gap-2 text-2xl font-bold">
                      <Share />
                      Share Your Results
                    </h2>
                    <p className="mb-4 text-sm text-gray-300">Show off your hustle! Share your results or download the image.</p>
                    <div className="mb-4 space-y-2">
                      <button
                        onClick={() => captureAndShare('download')}
                        className="flex w-full items-center justify-center gap-2 rounded bg-blue-600 px-4 py-3 font-bold text-white transition hover:bg-blue-700"
                      >
                        <Download />
                        Download Image
                      </button>
                      {navigator.share && (
                        <button
                          onClick={() => captureAndShare('native')}
                          className="flex w-full items-center justify-center gap-2 rounded bg-green-600 px-4 py-3 font-bold text-white transition hover:bg-green-700"
                        >
                          <Share />
                          Share (Native)
                        </button>
                      )}
                      <button
                        onClick={() => captureAndShare('twitter')}
                        className="w-full rounded bg-sky-500 px-4 py-3 font-bold text-white transition hover:bg-sky-600"
                      >
                        🐦 Share on X/Twitter
                      </button>
                      <button
                        onClick={() => captureAndShare('facebook')}
                        className="w-full rounded bg-blue-700 px-4 py-3 font-bold text-white transition hover:bg-blue-800"
                      >
                        📘 Share on Facebook
                      </button>
                    </div>
                    <button
                      onClick={() => setShowShareMenu(false)}
                      className="w-full rounded bg-gray-700 px-4 py-2 font-bold text-white transition hover:bg-gray-600"
                    >
                      Close
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 p-2 text-white sm:p-4">
            <div className="mx-auto max-w-6xl">
              <div className="sticky top-0 z-40 mb-3 rounded-lg bg-black/40 p-3 shadow-lg backdrop-blur sm:mb-4 sm:p-4">
                <div className="mb-2 grid grid-cols-2 gap-2 text-xs sm:grid-cols-5 sm:gap-3 sm:text-sm">
                  <div className="flex items-center gap-2">
                    <Calendar />
                    <span>Day {day}/{maxDays}</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <DollarSign />
                    <span className="text-green-400">${cash.toLocaleString()}</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <Bank />
                    <span className="text-blue-400">${bankBalance.toLocaleString()}</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <AlertTriangle />
                    <span className="text-red-400">${debt.toLocaleString()}</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <ShoppingCart />
                    <span>{totalItems}/{space}</span>
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-2 sm:grid-cols-4">
                  {debt > 0 && (
                    <button
                      onClick={payDebt}
                      disabled={cash === 0}
                      className="rounded bg-red-600 px-3 py-1.5 text-xs font-bold text-white transition hover:bg-red-700 disabled:bg-gray-600 sm:text-sm"
                    >
                      Pay Debt
                    </button>
                  )}
                  <button
                    onClick={() => setShowBank(true)}
                    className="flex items-center justify-center gap-1 rounded bg-emerald-600 px-3 py-1.5 text-xs font-bold text-white transition hover:bg-emerald-700 sm:text-sm"
                  >
                    <Bank />
                    Bank
                  </button>
                  <button
                    onClick={() => setShowLoanShark(true)}
                    className="flex items-center justify-center gap-1 rounded bg-orange-600 px-3 py-1.5 text-xs font-bold text-white transition hover:bg-orange-700 sm:text-sm"
                  >
                    <Skull />
                    Loan
                  </button>
                  <button
                    onClick={() => setShowUpgrades(true)}
                    className="flex items-center justify-center gap-1 rounded bg-blue-600 px-3 py-1.5 text-xs font-bold text-white transition hover:bg-blue-700 sm:text-sm"
                  >
                    <Backpack />
                    Upgrades
                  </button>
                </div>
              </div>

              {eventMessage && (
                <div className="mb-3 rounded-lg bg-yellow-600/90 p-3 text-xs font-bold text-black backdrop-blur animate-pulse sm:mb-4 sm:text-sm">
                  ⚡ {eventMessage}
                </div>
              )}

              {showLoanShark && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
                  <div className="w-full max-w-md rounded-lg bg-gradient-to-br from-red-900 to-black p-6">
                    <div className="mb-4 flex items-center gap-3">
                      <Skull />
                      <h2 className="text-2xl font-bold">The Loan Shark</h2>
                    </div>
                    <p className="mb-4 text-sm text-gray-300">
                      Need quick cash? I can help... for a price. {INTEREST_RATE * 100}% interest per day. Don't be late
                      with payments.
                    </p>
                    <div className="mb-4 space-y-2">
                      {[1000, 2500, 5000].map((amount) => (
                        <button
                          key={amount}
                          onClick={() => borrowMoney(amount)}
                          className="w-full rounded bg-red-700 px-4 py-2 font-bold text-white transition hover:bg-red-800"
                        >
                          Borrow ${amount.toLocaleString()}
                        </button>
                      ))}
                    </div>
                    <button
                      onClick={() => setShowLoanShark(false)}
                      className="w-full rounded bg-gray-700 px-4 py-2 font-bold text-white transition hover:bg-gray-600"
                    >
                      Leave
                    </button>
                  </div>
                </div>
              )}

              {showUpgrades && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
                  <div className="w-full max-w-md max-h-[80vh] overflow-y-auto rounded-lg bg-gradient-to-br from-blue-900 to-black p-6">
                    <h2 className="mb-4 text-2xl font-bold">Capacity Upgrades</h2>
                    <p className="mb-4 text-sm text-gray-300">Current Capacity: {space} items</p>
                    <div className="mb-4 space-y-3">
                      {UPGRADES.map((upgrade) => (
                        <div key={upgrade.name} className="rounded-lg bg-black/50 p-3">
                          <div className="mb-2 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                              <span className="text-2xl">{upgrade.icon}</span>
                              <div>
                                <div className="font-bold">{upgrade.name}</div>
                                <div className="text-xs text-gray-400">Capacity: {upgrade.capacity}</div>
                              </div>
                            </div>
                            <div className="text-right text-green-400 font-bold">${upgrade.cost.toLocaleString()}</div>
                          </div>
                          <button
                            onClick={() => buyUpgrade(upgrade)}
                            disabled={cash < upgrade.cost || space >= upgrade.capacity}
                            className="w-full rounded bg-blue-600 px-4 py-2 text-sm font-bold text-white transition hover:bg-blue-700 disabled:bg-gray-600"
                          >
                            {space >= upgrade.capacity ? 'Owned/Exceeded' : 'Purchase'}
                          </button>
                        </div>
                      ))}
                    </div>
                    <button
                      onClick={() => setShowUpgrades(false)}
                      className="w-full rounded bg-gray-700 px-4 py-2 font-bold text-white transition hover:bg-gray-600"
                    >
                      Close
                    </button>
                  </div>
                </div>
              )}

              {showBank && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
                  <div className="w-full max-w-md rounded-lg bg-gradient-to-br from-emerald-900 to-black p-6">
                    <div className="mb-4 flex items-center gap-3">
                      <Bank />
                      <h2 className="text-2xl font-bold">Swiss Bank</h2>
                    </div>
                    <p className="mb-4 text-sm text-gray-300">
                      Keep your cash safe from robbery and the loan shark. Protected storage with no fees.
                    </p>
                    <div className="mb-4 rounded-lg bg-black/50 p-4">
                      <div className="grid grid-cols-2 gap-4 text-center">
                        <div>
                          <div className="mb-1 text-xs text-gray-400">Pocket Cash</div>
                          <div className="text-lg font-bold text-green-400">${cash.toLocaleString()}</div>
                        </div>
                        <div>
                          <div className="mb-1 text-xs text-gray-400">Bank Balance</div>
                          <div className="text-lg font-bold text-blue-400">${bankBalance.toLocaleString()}</div>
                        </div>
                      </div>
                    </div>

                    <div className="mb-4">
                      <h3 className="mb-2 text-sm font-bold">Deposit Cash</h3>
                      <div className="grid grid-cols-2 gap-2">
                        {[1000, 5000, 10000].map((amount) => (
                          <button
                            key={amount}
                            onClick={() => depositToBank(amount)}
                            disabled={cash < amount}
                            className="rounded bg-emerald-600 px-4 py-2 text-sm font-bold text-white transition hover:bg-emerald-700 disabled:bg-gray-600"
                          >
                            ${amount.toLocaleString()}
                          </button>
                        ))}
                        <button
                          onClick={() => depositToBank(cash)}
                          disabled={cash === 0}
                          className="rounded bg-emerald-700 px-4 py-2 text-sm font-bold text-white transition hover:bg-emerald-800 disabled:bg-gray-600"
                        >
                          All
                        </button>
                      </div>
                    </div>

                    <div className="mb-4">
                      <h3 className="mb-2 text-sm font-bold">Withdraw Cash</h3>
                      <div className="grid grid-cols-2 gap-2">
                        {[1000, 5000, 10000].map((amount) => (
                          <button
                            key={amount}
                            onClick={() => withdrawFromBank(amount)}
                            disabled={bankBalance < amount}
                            className="rounded bg-blue-600 px-4 py-2 text-sm font-bold text-white transition hover:bg-blue-700 disabled:bg-gray-600"
                          >
                            ${amount.toLocaleString()}
                          </button>
                        ))}
                        <button
                          onClick={() => withdrawFromBank(bankBalance)}
                          disabled={bankBalance === 0}
                          className="rounded bg-blue-700 px-4 py-2 text-sm font-bold text-white transition hover:bg-blue-800 disabled:bg-gray-600"
                        >
                          All
                        </button>
                      </div>
                    </div>

                    <button
                      onClick={() => setShowBank(false)}
                      className="w-full rounded bg-gray-700 px-4 py-2 font-bold text-white transition hover:bg-gray-600"
                    >
                      Close
                    </button>
                  </div>
                </div>
              )}

              <div className="mb-3 rounded-lg bg-black/40 p-3 backdrop-blur sm:mb-4 sm:p-4">
                <div className="mb-3 flex items-center gap-2">
                  <MapPin />
                  <h2 className="text-base font-bold sm:text-lg">Locations</h2>
                </div>
                <div className="grid grid-cols-3 gap-2 sm:grid-cols-6">
                  {currentEra.locations.map((loc, idx) => (
                    <button
                      key={loc}
                      onClick={() => travel(idx)}
                      disabled={idx === location}
                      className={`rounded-lg px-2 py-2 text-xs font-bold transition sm:px-3 sm:text-sm ${
                        idx === location ? 'cursor-not-allowed bg-purple-600' : 'bg-slate-700 hover:bg-slate-600'
                      }`}
                    >
                      {loc}
                    </button>
                  ))}
                </div>
              </div>

              <div className="mb-3 rounded-lg bg-black/40 p-3 backdrop-blur sm:mb-4 sm:p-4">
                <h2 className="mb-3 text-base font-bold sm:text-lg">Market - {currentEra.locations[location]}</h2>
                <div className="grid grid-cols-1 gap-2 sm:grid-cols-2 lg:grid-cols-3 sm:gap-3">
                  {currentEra.products.map((product) => {
                    const owned = inventory[product.name] || 0;
                    const price = prices[product.name] || 0;
                    const basePrice = product.basePrice;
                    const priceChange = ((price - basePrice) / basePrice) * 100;

                    return (
                      <div key={product.name} className="rounded-lg bg-slate-800/50 p-3">
                        <div className="mb-2 flex items-center justify-between">
                          <div className="flex items-center gap-2">
                            <span className="text-xl sm:text-2xl">{product.icon}</span>
                            <span className="text-sm font-bold sm:text-base">{product.name}</span>
                          </div>
                          <div className="flex items-center gap-1 text-xs">
                            {priceChange > 20 ? (
                              <TrendingUp className="h-3 w-3 text-green-400" />
                            ) : priceChange < -20 ? (
                              <TrendingDown className="h-3 w-3 text-red-400" />
                            ) : null}
                            <span className={priceChange > 0 ? 'text-green-400' : 'text-red-400'}>
                              {priceChange > 0 ? '+' : ''}{priceChange.toFixed(0)}%
                            </span>
                          </div>
                        </div>
                        <div className="mb-2 text-xs text-gray-300 sm:text-sm">
                          Price: ${price.toLocaleString()} | Own: {owned}
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          <button
                            onClick={() => buy(product.name, 1)}
                            className="rounded bg-green-600 px-2 py-1.5 text-xs font-bold text-white transition hover:bg-green-700"
                          >
                            Buy 1
                          </button>
                          <button
                            onClick={() => buy(product.name, 5)}
                            className="rounded bg-green-700 px-2 py-1.5 text-xs font-bold text-white transition hover:bg-green-800"
                          >
                            Buy 5
                          </button>
                          <button
                            onClick={() => sell(product.name, 1)}
                            disabled={owned === 0}
                            className="rounded bg-red-600 px-2 py-1.5 text-xs font-bold text-white transition hover:bg-red-700 disabled:bg-gray-600"
                          >
                            Sell 1
                          </button>
                          <button
                            onClick={() => sell(product.name, owned)}
                            disabled={owned === 0}
                            className="rounded bg-red-700 px-2 py-1.5 text-xs font-bold text-white transition hover:bg-red-800 disabled:bg-gray-600"
                          >
                            Sell All
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<StreetHustler />);
    </script>
  </body>
</html>
